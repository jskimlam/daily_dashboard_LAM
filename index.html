<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Market Briefing</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root {
            --point-orange: #ff8c00;
            --main-black: #000000;
            --bg-gray: #f4f4f7;
            --security-red: #d93025;
            --text-gray: #777777;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; }

        /* [PC 전용: 스크롤 없는 전체 화면] */
        body {
            background-color: var(--bg-gray);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh; /* 화면 높이에 딱 맞춤 */
            padding: 5px;  /* 외부 여백 극소화 */
            overflow: hidden; /* 스크롤 금지 */
        }

        .container {
            width: 98%;
            max-width: 1300px;
            height: 98vh; /* 컨테이너가 화면의 거의 전체를 차지 */
            display: flex;
            flex-direction: column;
        }

        /* 1열: 제목 중앙 배치 */
        .title-row { width: 100%; text-align: center; margin-bottom: 2px; }
        .main-title { font-size: 1.8rem; font-weight: 900; letter-spacing: -1px; }

        /* 2열: 3컬럼 헤더 (여백 대폭 축소) */
        .sub-header-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 15px;
            align-items: center;
            width: 100%;
            padding: 5px 15px;
            margin-bottom: 5px;
            background: rgba(255,255,255,0.8);
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .header-left { text-align: right; }
        .security-header { color: var(--security-red); font-weight: 900; font-size: 0.85rem; }
        .dept-badge {
            display: inline-block;
            background-color: var(--point-orange);
            color: var(--main-black);
            font-weight: 800;
            font-size: 0.75rem;
            padding: 2px 8px;
            border: 1.5px solid var(--main-black);
            box-shadow: 1.5px 1.5px 0px var(--main-black);
        }

        .header-center { min-width: 250px; display: flex; justify-content: center; }
        .archive-select {
            padding: 3px; border: 1.5px solid var(--main-black); font-weight: bold;
            width: 100%; max-width: 240px; font-size: 0.8rem; cursor: pointer; text-align: center;
        }

        .header-right { text-align: left; }
        .ai-notice { font-size: 0.8rem; font-weight: 700; color: #d35400; }
        .typo-notice { font-size: 0.65rem; color: var(--text-gray); }

        /* [핵심] 3열: 메인 카드 영역 (비율에 맞춰 꽉 채움) */
        .card {
            background: white;
            border: 2px solid var(--main-black);
            padding: 5px;
            border-radius: 8px;
            flex: 1; /* 남은 모든 수직 공간을 사용 */
            display: flex;
            flex-direction: column;
            overflow: hidden; /* 내부 이미지 잘림 방지 */
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .img-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            overflow: hidden;
        }

        #mainImg {
            max-width: 100%;
            max-height: 100%; /* 상자의 높이를 넘지 않으면서 최대 크기 유지 */
            width: auto;
            height: auto;
            object-fit: contain; /* 비율 유지하며 꽉 채움 */
            margin-bottom: 0;    /* 내용 잘림 방지 */
        }

        /* 출처 정보 */
        .data-source {
            text-align: right; font-size: 0.65rem; color: var(--text-gray);
            padding: 3px 5px; font-style: italic;
        }

        .footer-area {
            display: flex; justify-content: center; align-items: center;
            gap: 15px; padding: 5px 0;
        }
        .license { font-weight: 800; font-size: 0.8rem; }
        .copyright { font-size: 0.7rem; color: #999; }

        /* [모바일 대응: 세로 스크롤 허용] */
        @media (max-width: 768px) {
            body { overflow-y: auto; height: auto; display: block; padding: 10px; }
            .container { height: auto; width: 100%; }
            .sub-header-row { display: flex; flex-direction: column; gap: 10px; background: none; border: none; padding: 0; }
            .header-left, .header-center, .header-right { text-align: center; width: 100%; }
            .card { flex: none; }
            #mainImg { width: 100%; height: auto; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title-row">
            <h1 class="main-title">DAILY MARKET BRIEFING</h1>
        </div>

        <header class="sub-header-row">
            <div class="header-left">
                <div class="security-header">사내 보안/복제 및 배포 금지</div>
                <div class="dept-badge">[롯데케미칼 첨단소재 구매부문]</div>
            </div>

            <div class="header-center">
                <select id="archiveDropdown" class="archive-select" onchange="changeImage(this.value)">
                    <option value="images/latest.webp">★ 최신 시황 보기 ★</option>
                </select>
            </div>

            <div class="header-right">
                <p class="ai-notice">📢 이 데일리 시황은 AI 학습 후 검토된 내용입니다.</p>
                <p class="typo-notice">노트북LM 제작으로 오타가 있을 수 있습니다.</p>
            </div>
        </header>
        
        <main class="card">
            <div class="img-container">
                <img src="images/latest.webp" id="mainImg">
            </div>
            <div class="data-source">Source: Platts / ICIS Commentary (AI Summarized)</div>
        </main>

        <footer class="footer-area">
            <div class="license">Created by JS Kim of Lam</div>
            <div class="copyright">© 2026 Lotte Chemical Advanced Materials.</div>
        </footer>
    </div>

    <script>
        fetch('images/list.json').then(res => res.json()).then(data => {
            const dropdown = document.getElementById('archiveDropdown');
            data.forEach(file => {
                const opt = document.createElement('option');
                opt.value = 'images/archive/' + file;
                opt.textContent = '기록: ' + file;
                dropdown.appendChild(opt);
            });
        });

        function changeImage(src) {
            const img = document.getElementById('mainImg');
            img.src = src + (src.includes('latest') ? "?t=" + new Date().getTime() : "");
        }
        window.onload = function() { changeImage('images/latest.webp'); };
    </script>
</body>
</html>
