<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Market Briefing</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root {
            --point-orange: #ff8c00;
            --main-black: #000000;
            --bg-gray: #f4f4f7;
            --security-red: #d93025;
            --text-gray: #777777;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; }

        /* [PC 전용: 16:9 와이드 원샷 레이아웃] */
        body {
            background-color: var(--bg-gray);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 10px;
            overflow: hidden; /* PC 스크롤 방지 */
        }

        .container {
            width: 98%;
            max-width: 1500px; /* 와이드 비율을 위해 가로폭 확장 */
            display: flex;
            flex-direction: column;
            height: 98vh;
        }

        /* 1열: 제목 (중앙 단독) */
        .title-row { width: 100%; text-align: center; margin-bottom: 5px; }
        .main-title { font-size: 2.2rem; font-weight: 900; letter-spacing: -1px; }

        /* 2열: 3컬럼 대칭 헤더 (어카이브 중앙) */
        .sub-header-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            align-items: center;
            width: 100%;
            padding: 8px 20px;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.8);
            border-radius: 12px;
            border: 1px solid #ddd;
        }

        .header-left { text-align: right; }
        .security-header { color: var(--security-red); font-weight: 900; font-size: 0.95rem; margin-bottom: 3px; }
        .dept-badge {
            display: inline-block;
            background-color: var(--point-orange);
            color: var(--main-black);
            font-weight: 800;
            font-size: 0.85rem;
            padding: 3px 12px;
            border: 2px solid var(--main-black);
            box-shadow: 2px 2px 0px var(--main-black);
        }

        .header-center { display: flex; justify-content: center; min-width: 300px; }
        .archive-select {
            padding: 5px; border: 2px solid var(--main-black); font-weight: bold;
            width: 100%; max-width: 280px; font-size: 0.85rem; cursor: pointer; text-align: center;
        }

        .header-right { text-align: left; }
        .ai-notice { font-size: 0.85rem; font-weight: 700; color: #d35400; margin-bottom: 2px; }
        .typo-notice { font-size: 0.75rem; color: var(--text-gray); }

        /* [핵심] 3열: 16:9 최적화 카드 영역 */
        .card {
            background: white;
            border: 2px solid var(--main-black);
            padding: 8px;
            border-radius: 8px;
            flex: 1; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .img-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            overflow: hidden;
        }

        #mainImg {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 16:9 비율을 유지하며 프레임에 꽉 채움 */
            margin-bottom: 0;    /* 하단 잘림 방지 */
        }

        .data-source {
            text-align: right; font-size: 0.7rem; color: var(--text-gray);
            padding: 5px 10px; font-style: italic;
        }

        .footer-area {
            display: flex; justify-content: center; align-items: center;
            gap: 20px; padding: 10px 0;
        }
        .license { font-weight: 800; font-size: 0.9rem; }
        .copyright { font-size: 0.8rem; color: #999; }

        /* 모바일 대응 (세로 스크롤 방식) */
        @media (max-width: 768px) {
            body { overflow-y: auto; height: auto; display: block; padding: 10px; }
            .container { height: auto; width: 100%; }
            .sub-header-row { display: flex; flex-direction: column; gap: 15px; background: none; border: none; padding: 0; }
            .header-left, .header-center, .header-right { text-align: center; width: 100%; }
            #mainImg { height: auto; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title-row">
            <h1 class="main-title">DAILY MARKET BRIEFING</h1>
        </div>

        <header class="sub-header-row">
            <div class="header-left">
                <div class="security-header">사내 보안/복제 및 배포 금지</div>
                <div class="dept-badge">[롯데케미칼 첨단소재 구매부문]</div>
            </div>

            <div class="header-center">
                <select id="archiveDropdown" class="archive-select" onchange="changeImage(this.value)">
                    <option value="images/latest.webp">★ 최신 시황 보기 ★</option>
                </select>
            </div>

            <div class="header-right">
                <p class="ai-notice">📢 이 데일리 시황은 AI를 학습시켜 작성 된 내용입니다.</p>
                <p class="typo-notice">본 페이지는 노트북LM으로 제작되어 오타가 있을 수 있습니다.</p>
            </div>
        </header>
        
        <main class="card">
            <div class="img-container">
                <img src="images/latest.webp" id="mainImg">
            </div>
            <div class="data-source">Source: Platts / ICIS Commentary (AI Summarized)</div>
        </main>

        <footer class="footer-area">
            <div class="license">Created by JS Kim of Lam</div>
            <div class="copyright">© 2026 Lotte Chemical Advanced Materials.</div>
        </footer>
    </div>

    <script>
        fetch('images/list.json').then(res => res.json()).then(data => {
            const dropdown = document.getElementById('archiveDropdown');
            data.forEach(file => {
                const opt = document.createElement('option');
                opt.value = 'images/archive/' + file;
                opt.textContent = '기록: ' + file;
                dropdown.appendChild(opt);
            });
        });

        function changeImage(src) {
            const img = document.getElementById('mainImg');
            img.src = src + (src.includes('latest') ? "?t=" + new Date().getTime() : "");
        }
        window.onload = function() { changeImage('images/latest.webp'); };
    </script>
</body>
</html>
